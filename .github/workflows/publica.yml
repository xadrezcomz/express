# Publica o site no GitHub Pages a cada mudança na branch main.
# (Settings → Pages → Source: "GitHub Actions")
name: Publica o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # lição com seta errada, contagem errada ou resposta ambígua não vai ao ar
      - name: Confere as lições do Aprender
        run: node ferramentas/valida-aprender.js
      # a oficina dos vídeos das lições não faz parte do site
      - run: rm -rf videos
      # cada publicação ganha uma "versão" nos links de estilo e de código das páginas (?v=...),
      # para o navegador não misturar a página nova com o estilo antigo que tinha guardado
      - name: Marca a versão dos arquivos
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i -E "s#((href|src)=\"[^\"]+\.(css|js))\"#\1?v=$V\"#g" index.html aprender/index.html
          grep -c "?v=$V" index.html aprender/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
